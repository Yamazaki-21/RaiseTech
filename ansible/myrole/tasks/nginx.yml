---
- name: Update yum and install nginx
  ansible.builtin.shell: |
    amazon-linux-extras enable nginx1
    yum update -y
    yum install -y nginx
  become: true

- name: Ensure rails-app-group exists
  group:
    name: rails-app-group
    state: present

- name: Add ec2-user to rails-app-group
  user:
    name: ec2-user
    groups: rails-app-group
    append: yes

- name: Add nginx to rails-app-group
  user:
    name: nginx
    groups: rails-app-group
    append: yes

- name: Ensure /var/www/rails-app and subdirectories exist
  file:
    path: /var/www/rails-app
    state: directory
    recurse: yes
    owner: ec2-user
    group: rails-app-group
    mode: '0775'

- name: Create Nginx config
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
  become: yes

- name: Reload systemd to pick up the new Nginx service file
  systemd:
    daemon_reload: yes
  become: yes

- name: Start and enable Nginx service
  systemd:
    name: nginx
    state: started
    enabled: yes
  become: yes


