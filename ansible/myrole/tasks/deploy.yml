---
- name: .gitディレクトリが存在するか確認
  stat:
    path: /var/www/rails-app/.git
  register: git_dir

- name: Railsアプリリポジトリをクローン
  git:
    repo: 'https://github.com/yuta-ushijima/raisetech-live8-sample-app.git'
    dest: /var/www/rails-app
    version: main
  when: not git_dir.stat.exists

- name: bundle installを実行
  shell: |
    export HOME=/home/ec2-user
    export PATH="$HOME/.rbenv/bin:$HOME/.rbenv/shims:$PATH"
    eval "$(rbenv init - bash)"
    cd /var/www/rails-app
    bundle install
  args:
    chdir: /var/www/rails-app
    executable: /bin/bash

- name: yarn installを実行
  shell: |
    export HOME=/home/ec2-user
    export PATH="$HOME/.nvm/versions/node/v17.9.1/bin:$HOME/.rbenv/bin:$HOME/.rbenv/shims:$PATH"
    eval "$(rbenv init -)"
    yarn install
  args:
    chdir: /var/www/rails-app
    executable: /bin/bash

