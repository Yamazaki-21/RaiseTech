---
- name: 依存パッケージをyumでインストール
  ansible.builtin.shell: |
    sudo yum install -y gcc gcc-c++ make libyaml-devel libffi-devel readline-devel zlib-devel openssl-devel git curl mariadb-devel

- name: Python 3.8用にboto3とbotocoreをインストール
  ansible.builtin.pip:
    name:
      - boto3
      - botocore
    executable: /usr/local/bin/pip3.8

- name: NVMをインストール
  shell: curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.3/install.sh | bash
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/ec2-user"
  become: false
  changed_when: false

- name: NVMを読み込み、Node.js 17.9.1をインストール
  shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
    nvm install 17.9.1
    nvm alias default 17.9.1
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/ec2-user"
  become: false

- name: npm経由でYarnをインストール
  shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
    npm install -g yarn@1.22.19
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/ec2-user"
  become: false

- name: rbenvをクローン
  git:
    repo: 'https://github.com/rbenv/rbenv.git'
    dest: ~/.rbenv
    update: no
  become: false

- name: ruby-buildプラグインをクローン
  git:
    repo: 'https://github.com/rbenv/ruby-build.git'
    dest: ~/.rbenv/plugins/ruby-build
    update: no
  become: false

- name: rbenv環境をセットアップ
  shell: |
    echo 'export PATH="$HOME/.rbenv/bin:$HOME/.rbenv/shims:$PATH"' >> ~/.bashrc
    echo 'eval "$(rbenv init - bash)"' >> ~/.bashrc
  args:
    executable: /bin/bash
  become: false

- name: Ruby 3.2.3がインストール済みか確認
  stat:
    path: "/home/ec2-user/.rbenv/versions/3.2.3"
  register: ruby_dir
  become: false

- name: rbenvでRuby 3.2.3をインストール
  shell: |
    export PATH="$HOME/.rbenv/bin:$HOME/.rbenv/shims:$PATH"
    eval "$(rbenv init - bash)"
    rbenv install 3.2.3
    rbenv global 3.2.3
  args:
    executable: /bin/bash
  when: not ruby_dir.stat.exists
  become: false

- name: Bundler 2.3.14をインストール
  shell: |
    export PATH="$HOME/.rbenv/bin:$HOME/.rbenv/shims:$PATH"
    eval "$(rbenv init -)"
    gem uninstall bundler
    gem install bundler -v 2.3.14
  args:
    executable: /bin/bash
  become: false

- name: Rails 7.1.3.2をインストール
  ansible.builtin.shell: |
    gem install rails -v 7.1.3.2
  become: false


- name: vips の依存関係をインストール（シェル経由）
  ansible.builtin.shell: |
    sudo yum install -y glib2-devel libxml2-devel libjpeg-turbo-devel libpng-devel libtiff-devel fftw-devel libexif-devel libgsf-devel giflib-devel libwebp-devel librsvg2-devel gobject-introspection-devel cairo-devel orc-devel poppler-glib-devel gdk-pixbuf2-devel make gcc gcc-c++ tar

- name: pip3 を使って meson と ninja をインストール
  pip:
    name:
      - meson
      - ninja
    executable: pip3

- name: libvips のソースをダウンロード
  get_url:
    url: "https://github.com/libvips/libvips/releases/download/v8.16.1/vips-8.16.1.tar.xz"
    dest: /tmp/vips.tar.xz

- name: libvips を展開する
  unarchive:
    src: /tmp/vips.tar.xz
    dest: /tmp/
    remote_src: yes
    extra_opts: [--xz]

- name: meson と ninja を使って libvips をビルド・インストール
  shell: |
    export PATH=/usr/local/bin:$PATH
    cd /tmp/vips-8.16.1
                                
