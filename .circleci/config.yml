version: 2.1

orbs:
  python: circleci/python@2.0.3

jobs:
  deploy:
    docker:
      - image: cimg/python:3.11
    environment:
      TARGET_HOST: "18.181.245.33"
      SSH_KEY_PATH: ~/.ssh/id_rsa
    steps:
      - checkout
      - run:
          name: Install Ansible
          command: |
            sudo apt update
            sudo apt install -y ansible
      - run:
          name: Add host to known_hosts
          command: |
            mkdir -p ~/.ssh
            ssh-keyscan -H ${TARGET_HOST} >> ~/.ssh/known_hosts
      - run:
          name: Run Ansible Playbook
          command: |
            ansible-playbook -i ansible/hosts ansible/playbook.yml

  test:
    docker:
      - image: cimg/python:3.11
    environment:
      TARGET_HOST: "18.181.245.33"
      SSH_KEY_PATH: ~/.ssh/id_rsa
    steps:
      - checkout
      - run:
          name: Install Serverspec
          command: |
            sudo apt update
            sudo apt install -y ruby ruby-dev build-essential curl
            echo 'export GEM_HOME="$HOME/.gem"' >> $BASH_ENV
            echo 'export PATH="$HOME/.gem/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
            gem install serverspec rake
      - run:
          name: Run ServerSpec Tests
          command: |
            cd serverspec
            rake spec

workflows:
  version: 2
  raisetech:
    jobs:
      - deploy:
      - test:
          requires:
            - deploy
          
